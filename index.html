<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Water Shop</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f7fb;color:#172033}
header{background:#087ea4;color:#fff;padding:18px}
main{max-width:950px;margin:auto;padding:15px}
.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
button{border:0;border-radius:9px;padding:12px;background:#087ea4;color:#fff;margin:4px;font-size:15px;cursor:pointer}
button.d{background:#b42318}
input,select{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border:1px solid #ccd5df;border-radius:8px}
table{width:100%;border-collapse:collapse}
td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}
.small{color:#64748b;font-size:13px}
.stat{font-size:26px;font-weight:bold;margin-top:8px}
.dashgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.dashcard{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px #0001}
.dashlabel{color:#64748b}
.err{color:#b42318;white-space:pre-wrap}
</style>
</head>
<body>
<header><b>Water Shop</b><div>Gestion de votre magasin</div></header>
<main id="app"></main>

<script>
const SUPABASE_URL="https://bzoewgyyjcwnqnjrbwgj.supabase.co";
const KEY="sb_publishable_yvJLY4g8HuehHHRchbB1lA_kKypIpNo";
const sb=supabase.createClient(SUPABASE_URL,KEY);
const K="water_shop_";

const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const get=k=>{try{return JSON.parse(localStorage.getItem(K+k)||"[]")}catch{return[]}};
const put=(k,v)=>localStorage.setItem(K+k,JSON.stringify(v));
const $=id=>document.getElementById(id);

function login(){
  $("app").innerHTML=`
  <div class="card">
    <h2>Connexion sécurisée</h2>
    <input id="emailInput" type="email" placeholder="E-mail" autocomplete="email">
    <input id="passwordInput" type="password" placeholder="Mot de passe" autocomplete="current-password">
    <button id="loginBtn">Se connecter</button>
    <p id="loginMsg" class="small"></p>
  </div>`;
  $("loginBtn").onclick=go;
  $("passwordInput").addEventListener("keydown",e=>{if(e.key==="Enter")go()});
}

async function go(){
  const msg=$("loginMsg"),btn=$("loginBtn");
  const email=$("emailInput").value.trim(),password=$("passwordInput").value;
  if(!email||!password){msg.textContent="Entre ton e-mail et ton mot de passe.";return}
  btn.disabled=true;msg.textContent="Connexion...";
  try{
    const r=await sb.auth.signInWithPassword({email,password});
    if(r.error)msg.textContent="Erreur : "+r.error.message;
    else await home();
  }catch(e){msg.textContent="Erreur de connexion : "+e.message}
  finally{btn.disabled=false}
}

async function home(){
  $("app").innerHTML=`<div class="card"><p>Chargement...</p></div>`;
  try{
    const {data:{user}}=await sb.auth.getUser();
    if(!user){login();return}
    $("app").innerHTML=`
    <div class="card">
      <b>Bonjour ${esc(user.email)}</b><br>
      <button id="logoutBtn">Déconnexion</button>
    </div>
    <div class="grid">
      <button onclick="dashboard()">📊 Tableau de bord</button>
      <button onclick="stock()">📦 Stock</button>
      <button onclick="products()">🛒 Produits</button>
      <button onclick="sales()">💰 Ventes & caisse</button>
      <button onclick="clients()">👥 Clients & crédits</button>
      <button onclick="employees()">👨‍💼 Employés</button>
      <button onclick="coupeurs()">👷 Coupeurs</button>
      <button onclick="deliveries()">🚛 Livraisons</button>
    </div>`;
    $("logoutBtn").onclick=async()=>{await sb.auth.signOut();login()};
  }catch(e){
    $("app").innerHTML=`<div class="card"><p class="err">Erreur : ${esc(e.message)}</p><button onclick="home()">Réessayer</button></div>`;
  }
}

function coupeurs(){
  let d=get("coupeurs"),prod=get("productions_coupeurs");
  let noms=[...new Set(d.map(x=>x.nom).filter(Boolean))];
  $("app").innerHTML=`
  <div class="card"><button onclick="home()">← Retour</button><h2>👷 Coupeurs & Production</h2>
  <h3>👷 Ajouter un coupeur</h3>
  <input id="cnm" placeholder="Nom du coupeur"><input id="ctel" placeholder="Téléphone">
  <button onclick="addCoupeur()">➕ Enregistrer le coupeur</button></div>
  <div class="card"><h3>🏭 Enregistrer une production</h3>
  <select id="pn"><option value="">Choisir le coupeur</option>${noms.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("")}</select>
  <select id="pm"><option value="">Choisir la machine</option><option>Machine 1</option><option>Machine 2</option><option>Machine 3</option></select>
  <input id="pq" type="number" min="1" value="1" placeholder="Nombre de productions">
  <input id="pt" type="number" min="0" value="0" placeholder="Tarif par production">
  <button onclick="addProductionCoupeur()">✅ Enregistrer la production</button></div>
  <div class="card"><h3>📊 Production par coupeur</h3><div style="overflow:auto"><table>
  <tr><th>Coupeur</th><th>Machine</th><th>Total productions</th></tr>
  ${d.map(x=>{let total=prod.filter(z=>z.coupeur===x.nom).reduce((a,z)=>a+(Number(z.qte)||0),0);let last=prod.find(z=>z.coupeur===x.nom);return `<tr><td>${esc(x.nom)}</td><td>${esc(last?.machine||"—")}</td><td><b>${total}</b></td></tr>`}).join("")}
  </table></div></div>
  <div class="card"><h3>📋 Historique de production</h3><div style="overflow:auto"><table>
  <tr><th>Date</th><th>Coupeur</th><th>Machine</th><th>Productions</th><th>Tarif</th><th>Total</th></tr>
  ${prod.map(x=>`<tr><td>${new Date(x.date).toLocaleString("fr-FR")}</td><td>${esc(x.coupeur)}</td><td>${esc(x.machine||"—")}</td><td>${x.qte}</td><td>${Number(x.tarif||0).toLocaleString("fr-FR")}</td><td><b>${(Number(x.qte||0)*Number(x.tarif||0)).toLocaleString("fr-FR")}</b></td></tr>`).join("")}
  </table></div></div>`;
}
function addCoupeur(){
  const nom=$("cnm").value.trim();if(!nom){alert("Nom du coupeur obligatoire");return}
  let d=get("coupeurs");d.unshift({nom,tel:$("ctel").value.trim()});put("coupeurs",d);coupeurs();
}
function addProductionCoupeur(){
  if(!$("pn").value){alert("Choisis un coupeur");return}
  if(!$("pm").value){alert("Choisis une machine");return}
  let d=get("productions_coupeurs");d.unshift({date:new Date().toISOString(),coupeur:$("pn").value,machine:$("pm").value,qte:Math.max(1,+$("pq").value||1),tarif:Math.max(0,+$("pt").value||0)});
  put("productions_coupeurs",d.slice(0,500));coupeurs();
}

async function dashboard(){
  $("app").innerHTML=`<div class="card"><button onclick="home()">← Retour</button><h2>📊 Tableau de bord</h2><p class="small">Chargement...</p></div>`;
  let [p,c,e]=await Promise.all([
    sb.from("products").select("*",{count:"exact",head:true}),
    sb.from("customers").select("*",{count:"exact",head:true}),
    sb.from("employees").select("*",{count:"exact",head:true})
  ]);
  let salesData=get("sales"),deliveriesData=get("deliveries");
  let total=salesData.reduce((a,x)=>a+(Number(x.total)||0),0),paid=salesData.reduce((a,x)=>a+(Number(x.pay)||0),0),credit=salesData.reduce((a,x)=>a+(Number(x.rest)||0),0);
  $("app").innerHTML=`<div class="card"><button onclick="home()">← Retour</button><h2>📊 Tableau de bord</h2>
  <div class="dashgrid">
  <div class="dashcard"><div class="dashlabel">🛒 Produits</div><div class="stat">${p.count??0}</div></div>
  <div class="dashcard"><div class="dashlabel">👥 Clients</div><div class="stat">${c.count??0}</div></div>
  <div class="dashcard"><div class="dashlabel">👨‍💼 Employés</div><div class="stat">${e.count??0}</div></div>
  <div class="dashcard"><div class="dashlabel">🚛 Livraisons</div><div class="stat">${deliveriesData.length}</div></div>
  <div class="dashcard"><div class="dashlabel">💰 Ventes</div><div class="stat">${salesData.length}</div></div>
  <div class="dashcard"><div class="dashlabel">💵 Chiffre d'affaires</div><div class="stat">${total.toLocaleString()} F</div></div>
  <div class="dashcard"><div class="dashlabel">✅ Encaissé</div><div class="stat">${paid.toLocaleString()} F</div></div>
  <div class="dashcard"><div class="dashlabel">📒 À crédit</div><div class="stat">${credit.toLocaleString()} F</div></div>
  </div></div>`;
}

async function stock(){
  let r=await sb.from("products").select("id,nom,unite,prix_achat,prix_vente").order("nom");
  if(r.error){$("app").innerHTML=`<div class="card"><button onclick="home()">← Retour</button><p class="err">Erreur : ${esc(r.error.message)}</p></div>`;return}
  let d=r.data||[],st=get("stock");
  $("app").innerHTML=`<div class="card"><button onclick="home()">← Retour</button><h2>📦 Gestion du stock</h2>
  <select id="sp"><option value="">Choisir un produit</option>${d.map(x=>`<option value="${x.id}">${esc(x.nom)}</option>`).join("")}</select>
  <input id="se" type="number" min="1" value="1" placeholder="Quantité">
  <select id="sm"><option value="in">➕ Entrée de stock</option><option value="out">➖ Sortie de stock</option></select>
  <button onclick="saveStockMove()">✅ Enregistrer le mouvement</button></div>
  <div class="card"><h3>État du stock</h3><div style="overflow:auto"><table><tr><th>Produit</th><th>Stock restant</th><th>Unité</th></tr>
  ${d.map(x=>{let q=st.filter(m=>String(m.product_id)===String(x.id)).reduce((a,m)=>a+(m.type==="in"?m.qte:-m.qte),0);return `<tr><td>${esc(x.nom)}</td><td><b>${q}</b></td><td>${esc(x.unite||"")}</td></tr>`}).join("")}
  </table></div></div>
  <div class="card"><h3>Historique des mouvements</h3><div style="overflow:auto"><table><tr><th>Date</th><th>Produit</th><th>Type</th><th>Qté</th></tr>
  ${st.map(m=>{let x=d.find(z=>String(z.id)===String(m.product_id));return `<tr><td>${new Date(m.date).toLocaleString("fr-FR")}</td><td>${esc(x?.nom||"Produit supprimé")}</td><td>${m.type==="in"?"Entrée":"Sortie"}</td><td>${m.qte}</td></tr>`}).join("")}
  </table></div></div>`;
}
function saveStockMove(){
  if(!$("sp").value){alert("Choisis un produit");return}
  let q=Math.max(1,+$("se").value||1),st=get("stock"),current=st.filter(m=>String(m.product_id)===String($("sp").value)).reduce((a,m)=>a+(m.type==="in"?m.qte:-m.qte),0);
  if($("sm").value==="out"&&q>current){alert("Stock insuffisant");return}
  st.unshift({date:new Date().toISOString(),product_id:$("sp").value,type:$("sm").value,qte:q});put("stock",st.slice(0,500));stock();
}

async function products(){
  let r=await sb.from("products").select("*").limit(100);
  if(r.error){$("app").innerHTML=`<div class="card"><p class="err">Erreur : ${esc(r.error.message)}</p><button onclick="home()">Retour</button></div>`;return}
  let d=r.data||[];
  $("app").innerHTML=`<div class="card"><button onclick="home()">← Retour</button><h2>🛒 Produits</h2><button onclick="productForm()">➕ Ajouter</button><div style="overflow:auto"><table><tr><th>Nom</th><th>Catégorie</th><th>Prix vente</th><th>Action</th></tr>
  ${d.map(x=>`<tr><td>${esc(x.nom)}</td><td>${esc(x.categorie)}</td><td>${Number(x.prix_vente||0).toLocaleString()} F</td><td><button class="d" onclick="delProduct(${x.id})">Supprimer</button></td></tr>`).join("")}
  </table></div></div>`;
}
function productForm(){
  $("app").innerHTML=`<div class="card"><button onclick="products()">← Retour</button><h2>Ajouter un produit</h2>
  <input id="pnm" placeholder="Nom"><input id="pcat" placeholder="Catégorie"><input id="punit" value="pack" placeholder="Unité">
  <input id="pachat" type="number" placeholder="Prix d'achat"><input id="pvente" type="number" placeholder="Prix de vente">
  <button onclick="saveProduct()">Enregistrer</button><p id="productMsg" class="small"></p></div>`;
}
async function saveProduct(){
  let x={nom:$("pnm").value.trim(),categorie:$("pcat").value.trim(),unite:$("punit").value.trim()||"pack",prix_achat:+$("pachat").value||0,prix_vente:+$("pvente").value||0,actif:true};
  if(!x.nom||!x.categorie){$("productMsg").textContent="Nom et catégorie obligatoires";return}
  let r=await sb.from("products").insert(x);if(r.error)$("productMsg").textContent=r.error.message;else products();
}
async function delProduct(id){if(confirm("Supprimer ?")){let r=await sb.from("products").delete().eq("id",id);if(r.error)alert(r.error.message);else products()}}

async function sales(){
  let r=await sb.from("products").select("id,nom,prix_vente,unite").eq("actif",true).order("nom");
  if(r.error){$("app").innerHTML=`<div class="card"><p class="err">${esc(r.error.message)}</p><button onclick="home()">Retour</button></div>`;return}
  let o=(r.data||[]).map(x=>`<option value="${x.id}" data-price="${x.prix_vente||0}">${esc(x.nom)} — ${Number(x.prix_vente||0).toLocaleString()} F</option>`).join("");
  $("app").innerHTML=`<div class="card"><button onclick="home()">← Retour</button><h2>💰 Ventes & caisse</h2>
  <select id="saleProduct"><option value="">Choisir un produit</option>${o}</select>
  <input id="saleQty" type="number" min="1" value="1"><input id="salePay" type="number" min="0" value="0" placeholder="Montant payé">
  <p>Total : <b id="saleTotal">0 F</b></p><p>Reste : <b id="saleRest">0 F</b></p>
  <button id="saleBtn">✅ Enregistrer</button></div>
  <div class="card"><h3>Historique</h3><div style="overflow:auto"><table><tr><th>Date</th><th>Produit</th><th>Qté</th><th>Total</th><th>Payé</th><th>Reste</th></tr>
  ${get("sales").map(x=>`<tr><td>${new Date(x.date).toLocaleString("fr-FR")}</td><td>${esc(x.produit)}</td><td>${x.q}</td><td>${x.total} F</td><td>${x.pay} F</td><td>${x.rest} F</td></tr>`).join("")}
  </table></div></div>`;
  $("saleProduct").onchange=calcSale;$("saleQty").oninput=calcSale;$("salePay").oninput=calcSale;$("saleBtn").onclick=saveSale;calcSale();
}
function calcSale(){
  const o=$("saleProduct").options[$("saleProduct").selectedIndex],p=+o?.dataset.price||0,t=p*(+$("saleQty").value||1),pa=+$("salePay").value||0;
  $("saleTotal").textContent=t.toLocaleString()+" F";$("saleRest").textContent=Math.max(0,t-pa).toLocaleString()+" F";
}
function saveSale(){
  if(!$("saleProduct").value){alert("Choisis un produit");return}
  let o=$("saleProduct").options[$("saleProduct").selectedIndex],p=+o.dataset.price,q=Math.max(1,+$("saleQty").value||1),t=p*q,pa=Math.max(0,+$("salePay").value||0),s=get("sales");
  s.unshift({date:new Date().toISOString(),produit:o.textContent.split(" — ")[0],q,total:t,pay:pa,rest:Math.max(0,t-pa)});put("sales",s.slice(0,300));sales();
}

function clients(){
  let d=get("clients");
  $("app").innerHTML=`<div class="card"><button onclick="home()">← Retour</button><h2>👥 Clients & crédits</h2>
  <input id="clientName" placeholder="Nom du client"><input id="clientTel" placeholder="Téléphone"><input id="clientCredit" type="number" placeholder="Crédit / dette">
  <button onclick="addClient()">➕ Enregistrer client</button></div>
  <div class="card"><div style="overflow:auto"><table><tr><th>Client</th><th>Téléphone</th><th>Crédit</th><th></th></tr>
  ${d.map((x,i)=>`<tr><td>${esc(x.n)}</td><td>${esc(x.t)}</td><td>${x.c} F</td><td><button class="d" onclick="delItem('clients',${i},clients)">X</button></td></tr>`).join("")}
  </table></div></div>`;
}
function addClient(){
  if(!$("clientName").value.trim())return;
  let d=get("clients");d.unshift({n:$("clientName").value.trim(),t:$("clientTel").value.trim(),c:+$("clientCredit").value||0});put("clients",d);clients();
}

async function employees(){
  let r=await sb.from("employees").select("*").order("id",{ascending:false}).limit(100);
  if(r.error){$("app").innerHTML=`<div class="card"><button onclick="home()">← Retour</button><h2>👨‍💼 Employés</h2><p class="err">Erreur : ${esc(r.error.message)}</p></div>`;return}
  let d=r.data||[];
  $("app").innerHTML=`<div class="card"><button onclick="home()">← Retour</button><h2>👨‍💼 Employés</h2>
  <input id="empName" placeholder="Nom"><input id="empTel" placeholder="Téléphone"><input id="empPost" placeholder="Poste">
  <button onclick="addEmployee()">➕ Enregistrer</button></div><div class="card"><div style="overflow:auto"><table>
  <tr><th>Nom</th><th>Téléphone</th><th>Poste</th><th></th></tr>
  ${d.map(x=>`<tr><td>${esc(x.nom)}</td><td>${esc(x.telephone)}</td><td>${esc(x.poste)}</td><td><button class="d" onclick="deleteEmployee(${x.id})">X</button></td></tr>`).join("")}
  </table></div></div>`;
}
async function addEmployee(){
  let nom=$("empName").value.trim(),telephone=$("empTel").value.trim(),poste=$("empPost").value.trim();
  if(!nom){alert("Nom obligatoire");return}
  let r=await sb.from("employees").insert({nom,telephone,poste});
  if(r.error)alert("Erreur : "+r.error.message);else employees();
}
async function deleteEmployee(id){
  if(confirm("Supprimer ?")){let r=await sb.from("employees").delete().eq("id",id);if(r.error)alert("Erreur : "+r.error.message);else employees()}
}

function deliveries(){
  let d=get("deliveries");
  $("app").innerHTML=`<div class="card"><button onclick="home()">← Retour</button><h2>🚛 Livraisons</h2>
  <input id="delClient" placeholder="Client"><input id="delProduct" placeholder="Produit"><input id="delQty" type="number" min="1" value="1" placeholder="Quantité"><input id="delAddress" placeholder="Adresse">
  <button onclick="addDelivery()">➕ Enregistrer la livraison</button></div>
  <div class="card"><h3>Historique</h3><div style="overflow:auto"><table><tr><th>Date</th><th>Client</th><th>Produit</th><th>Qté</th><th>Adresse</th><th></th></tr>
  ${d.map((x,i)=>`<tr><td>${new Date(x.date).toLocaleString("fr-FR")}</td><td>${esc(x.client)}</td><td>${esc(x.produit)}</td><td>${x.qte}</td><td>${esc(x.adresse)}</td><td><button class="d" onclick="delDelivery(${i})">X</button></td></tr>`).join("")}
  </table></div></div>`;
}
function addDelivery(){
  let client=$("delClient").value.trim(),produit=$("delProduct").value.trim(),qte=Math.max(1,+$("delQty").value||1),adresse=$("delAddress").value.trim();
  if(!client||!produit){alert("Client et produit obligatoires");return}
  let d=get("deliveries");d.unshift({date:new Date().toISOString(),client,produit,qte,adresse});put("deliveries",d.slice(0,300));deliveries();
}
function delDelivery(i){let d=get("deliveries");d.splice(i,1);put("deliveries",d);deliveries()}
function delItem(k,i,fn){let d=get(k);d.splice(i,1);put(k,d);fn()}

sb.auth.onAuthStateChange((event)=>{
  if(event==="SIGNED_OUT")login();
});
home();
</script>
</body>
</html>
